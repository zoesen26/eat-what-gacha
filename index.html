<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:"Arial Rounded MT Bold","Microsoft YaHei",system-ui,sans-serif;color:#181818;background:#fce4ec}body{min-height:100vh;overflow-x:hidden}.app{min-height:100svh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse 90% 70% at 0% 0%,#ffb3cc 0%,transparent 55%),radial-gradient(ellipse 80% 65% at 100% 5%,#a8e6cf 0%,transparent 55%),radial-gradient(ellipse 85% 70% at 100% 100%,#bfd5ff 0%,transparent 55%),radial-gradient(ellipse 90% 65% at 0% 100%,#ffe680 0%,transparent 55%),radial-gradient(ellipse 55% 45% at 50% 50%,#ffc8e8 0%,transparent 65%),#fce4ec}.page{display:none;width:min(720px,100%);min-height:calc(100svh - 36px);place-items:center;text-align:center}.page.active{display:grid;animation:pageIn .28s ease both}.choice-title{margin:0 0 20px;font-size:clamp(36px,11vw,56px);line-height:1.05;text-shadow:3px 3px 0 #ffd2df,-2px 2px 0 #c9f3e8}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:8px auto 4px;width:min(430px,100%)}.choice-grid .btn{width:100%;min-height:58px;padding:12px 14px;font-size:20px;background:#fff6c9}.choice-grid .btn:nth-child(3n+1){background:#ffd86d}.choice-grid .btn:nth-child(3n+2){background:#b9f4d5}.choice-grid .btn:nth-child(3n){background:#bde8ff}.empty-text{margin:0 auto 22px;width:min(360px,100%);font-size:20px;font-weight:900;line-height:1.45;color:#4b4b4b}.actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.actions .btn{font-size:19px;padding:13px 22px}.panel{width:min(520px,100%);padding:28px 20px;border:5px solid #111;border-radius:30px;background:linear-gradient(145deg,#fffbec 0%,#fff0f5 100%);box-shadow:8px 8px 0 #111}.title{margin:0 0 18px;font-size:clamp(58px,19vw,108px);line-height:.98;text-shadow:4px 4px 0 #ffd2df,-3px 3px 0 #c9f3e8;letter-spacing:0}.subtitle{margin:0 0 24px;font-size:18px;font-weight:900;color:#4b4b4b}.btn{border:4px sol 0,0,.18);opacity:0;transform:translateY(-150px) scale(.8);pointer-events:none}.prize.ready{opacity:1;pointer-events:auto;animation:drop .9s cubic-bezier(.28,1.55,.52,1) forwards;cursor:pointer}.prize.ready:before{content:"点我";position:absolute;left:50%;bottom:-38px;transform:translateX(-50%);width:max-content;padding:4px 10px;border:3px solid #111;border-radius:999px;background:#fff6c9;font-size:15px;font-weight:900}.prize.open{animation:open .52s ease forwards}.hint{min-height:34px;margin:4px 0 0;font-size:17px;font-weight:900;line-height:1.35;color:#555}.food{display:block;width:min(330px,76vw);height:230px;margin:0 auto 12px;object-fit:contain;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15));animation:pop .42s ease both}.result-title{margin:0 0 12px;font-size:clamp(30px,9vw,50px);line-height:1.1}.name{color:#ff6b8a;text-shadow:2px 2px 0 #111}.info{display:grid;gap:10px;margin:18px auto 24px;width:min(370px,100%);text-align:left}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border:3px solid #111;border-radius:18px;font-weight:900}.row:nth-child(1){background:#ffd86d}.row:nth-child(2){background:#b9f4d5}.row:nth-child(3){background:#bde8ff}.row span{color:#333}.sparkle{position:absolute;inset:0;pointer-events:none;overflow:hidden}.sparkle i{position:absolute;border:3px solid #111;border-radius:50%;animation:float 4s infinite ease-in-out}.s1{left:7%;top:22%;width:18px;height:18px;background:#ffcfdf}.s2{right:9%;top:26%;width:14px;height:14px;background:#b9f4d5;animation-delay:.8s}.s3{left:12%;bottom:18%;width:22px;height:22px;background:#ffe480;animation-delay:1.4s}.s4{right:13%;bottom:20%;width:16px;height:16px;background:#bde8ff;animation-delay:2s}.s5{left:22%;top:8%;width:12px;height:12px;background:#ffc6ff;animation-delay:.4s}.s6{right:24%;top:10%;width:20px;height:20px;background:#ffd86d;animation-delay:1.1s}.s7{left:4%;top:52%;width:11px;height:11px;background:#caffbf;animation-delay:2.5s}.s8{right:5%;bottom:44%;width:16px;height:16px;background:#ffb3c6;animation-delay:1.8s}@media(min-width:769px){.app{padding:32px}.panel{padding:36px 32px;border-radius:36px;box-shadow:10px 10px 0 #111;width:min(580px,100%)}.choice-grid{gap:16px;width:min(480px,100%)}.choice-grid .btn{min-height:64px;font-size:21px}.actions .btn{font-size:20px;padding:15px 30px}.info{gap:12px}.row{padding:13px 18px;font-size:17px}.s1{width:26px;height:26px}.s3{width:32px;height:32px}.s6{width:26px;height:26px}}@keyframes wiggle{0%{transform:translate(0,0) rotate(-12deg)}33%{transform:translate(20px,-18px) rotate(24deg)}66%{transform:translate(-18px,14px) rotate(-30deg)}100%{transform:translate(14px,20px) rotate(18deg)}}@keyframes shake{from{transform:translateX(-3px) rotate(-.7deg)}to{transform:translateX(3px) rotate(.7deg)}}@keyframes drop{0%{opacity:1;transform:translateY(-155px) scale(.75) rotate(-25deg)}62%{transform:translateY(34px) scale(1.04) rotate(28deg)}78%{transform:translateY(6px) scale(.96) rotate(-10deg)}90%{transform:translateY(24px) scale(1.01) rotate(8deg)}100%{opacity:1;transform:translateY(18px) scale(1) rotate(0)}}@keyframes open{0%{transform:translateY(18px) scale(1);opacity:1}55%{transform:translateY(18px) scale(1.18) rotate(12deg);opacity:1}100%{transform:translateY(18px) scale(.2) rotate(50deg);opacity:0}}@keyframes pop{from{transform:scale(.55) rotate(-7deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes float{50%{transform:translateY(-18px) rotate(18deg)}}@media(max-width:520px){.app{padding:12px}.page{min-height:calc(100svh - 24px)}.machine-page{align-content:start;gap:20px;padding-top:18px}.machine{width:min(520px,94vw);height:min(620px,106vw)}.panel{border-radius:25px;box-shadow:7px 7px 0 #111}.btn{width:100%;max-width:290px;font-size:21px}.machine-page .btn{margin:8px 0 22px}.ball{width:42px;height:42px;border-width:3px}.prize{width:58px;height:58px}.food{height:205px}.hint{min-height:44px;margin-top:10px;font-size:16px;line-height:1.45}.choice-grid{grid-template-columns:1fr;gap:12px}.choice-grid .btn{max-width:none}.actions{gap:12px}.actions .btn{max-width:290px}}</style></head><body><main class="app"><div class="sparkle" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><i class="s6"></i><i class="s7"></i><i class="s8"></i></div><section id="home" class="page active"><div class="panel"><h1 class="title">吃什么？</h1><p class="subtitle">让扭蛋机替你决定今天这顿饭。</p><button id="go" class="btn">开始扭蛋</button></div></section><section id="distance-page" class="page"><div class="panel"><h2 class="choice-title">选择距离</h2><div class="choice-grid"><button class="btn choice-distance" data-distance="all">不限距离</button><button class="btn choice-distance" data-distance="北师大校内">北师大校内</button><button class="btn choice-distance" data-distance="1-3km">1-3km</button><button class="btn choice-distance" data-distance="3-6km">3-6km</button><button class="btn choice-distance" data-distance="6-10km">6-10km</button></div></div></section><section id="category-page" class="page"><div class="panel"><h2 class="choice-title">选择类别</h2><div class="choice-grid"><button class="btn choice-category" data-category="all">不限类别</button><button class="btn choice-category" data-category="烤肉">铁盘烤肉</button><button class="btn choice-category" data-category="韩餐">韩餐</button><button class="btn choice-category" data-category="中餐">中餐</button><button class="btn choice-category" data-category="烧烤">烧烤</button><button class="btn choice-category" data-category="火锅">火锅</button><button class="btn choice-category" data-category="自助餐">自助餐</button><button class="btn choice-category" data-category="西餐">西餐</button><button class="btn choice-category" data-category="披萨">披萨</button><button class="btn choice-category" data-category="日料">日料</button></div></div></section><section id="draw" class="page machine-page"><div id="machine" class="machine"><div class="chamber" aria-hidden="true"><i class="ball b1"></i><i class="ball b2"></i><i class="ball b3"></i><i class="ball b4"></i><i class="ball b5"></i><i class="ball b6"></i><i class="ball b7"></i><i class="ball b8"></i></div><img class="machine-img" src="compressed-assets/MACHINE.png" alt="扭蛋机"><div class="drop"><div id="prize" class="prize" title="点击打开扭蛋"></div></div></div><div><button id="start" class="btn">开始扭蛋</button><p id="hint" class="hint">按下按钮，看看今天吃什么。</p></div></section><section id="result" class="page"><div class="panel"><img id="food" class="food" alt="抽中的食物"><h2 class="result-title">今天吃：<span id="name" class="name"></span></h2><div class="info"><div class="row"><span>类别</span><strong id="category"></strong></div><div class="row"><span>地点</span><strong id="location"></strong></div><div class="row"><span>距离</span><strong id="distance"></strong></div></div><div class="actions"><button id="again" class="btn">重新扭蛋</button><button id="reselect" class="btn">重新选择条件</button><button id="result-home" class="btn">回到首页</button></div></div></section><section id="empty" class="page"><div class="panel"><h2 class="choice-title">没有结果</h2><p class="empty-text">暂时没有符合条件的餐厅，请重新选择</p><div class="actions"><button id="empty-reselect" class="btn">重新选择条件</button><button id="empty-home" class="btn">返回首页</button></div></div></section></main><script>const restaurants=[{name:"海底捞",category:"火锅",location:"枫蓝国际购物中心",distance:"1-3km",icon:"hotpot"},{name:"鲜牛记潮汕牛肉火锅",category:"火锅",location:"枫蓝国际购物中心",distance:"1-3km",icon:"hotpot"},{name:"大叹号烤肉",category:"烤肉",location:"枫蓝国际购物中心",distance:"1-3km",icon:"bbq"},{name:"牛角烤肉",category:"烤肉",location:"枫蓝国际购物中心",distance:"1-3km",icon:"bbq"},{name:"北丐先生",category:"烧烤",location:"枫蓝国际购物中心",distance:"1-3km",icon:"skewer"},{name:"滨寿司",category:"日料",location:"枫蓝国际购物中心",distance:"1-3km",icon:"sushi"},{name:"村上一屋",category:"日料",location:"枫蓝国际购物中心",distance:"1-3km",icon:"sushi"},{name:"必胜客",category:"披萨",location:"枫蓝国际购物中心",distance:"1-3km",icon:"pizza"},{name:"赛 pressed-assets/WESTERN.png",chinese:"compressed-assets/CHINESE.png",buffet:"compressed-assets/BUFFET.png"};const page={home:document.getElementById("home"),distance:document.getElementById("distance-page"),category:document.getElementById("category-page"),draw:document.getElementById("draw"),result:document.getElementById("result"),empty:document.getElementById("empty")};const go=document.getElementById("go"),start=document.getElementById("start"),again=document.getElementById("again"),reselect=document.getElementById("reselect"),resultHome=document.getElementById("result-home"),emptyReselect=document.getElementById("empty-reselect"),emptyHome=document.getElementById("empty-home"),machine=document.getElementById("machine"),prize=document.getElementById("prize"),hint=document.getElementById("hint"),food=document.getElementById("food"),nameEl=document.getElementById("name"),categoryEl=document.getElementById("category"),locationEl=document.getElementById("location"),distanceEl=document.getElementById("distance");let drawing=false,canOpen=false,selectedDistance="all",selectedCategory="all";function show(which){Object.values(page).forEach(p=>p.classList.remove("active"));page[which].classList.add("active")}function clearResult(){food.removeAttribute("src");food.alt="抽中的食物";nameEl.textContent="";categoryEl.textContent="";locationEl.textContent="";distanceEl.textContent=""}function reset(){drawing=false;canOpen=false;machine.classList.remove("shake");prize.className="prize";hint.textContent="按下按钮，看看今天吃什么。";start.disabled=false;start.textContent="开始扭蛋";clearResult()}function goHome(){selectedDistance="all";selectedCategory="all";reset();show("home")}function filteredRestaurants(){return restaurants.filter(r=>(selectedDistance==="all"||r.distance===selectedDistance)&&(selectedCategory==="all"||r.category===selectedCategory))}function hasMatches(){return filteredRestaurants().length>0}function chooseDistance(value){selectedDistance=value;show("category")}function chooseCategory(value){selectedCategory=value;reset();show(hasMatches()?"draw":"empty")}function draw(){if(drawing)return;if(!hasMatches()){show("empty");return}drawing=true;canOpen=false;start.disabled=true;start.textContent="扭蛋中...";hint.textContent="小球正在仓里转呀转。";prize.className="prize";machine.classList.add("shake");setTimeout(()=>{machine.classList.remove("shake");prize.classList.add("ready");canOpen=true;hint.textContent="扭蛋掉出来啦，点击它打开！"},2600)}function openPrize(){if(!canOpen)return;const pool=filteredRestaurants();if(!pool.length){canOpen=false;show("empty");return}canOpen=false;prize.classList.add("open");hint.textContent="打开中...";setTimeout(()=>{const r=pool[Math.floor(Math.random()*pool.length)];food.src=imageMap[r.icon];food.alt=r.category;nameEl.textContent=r.name;categoryEl.textContent=r.category;locationEl.textContent=r.location;distanceEl.textContent=r.distance;show("result")},540)}go.addEventListener("click",()=>{selectedDistance="all";selectedCategory="all";reset();show("distance")});document.querySelectorAll(".choice-distance").forEach(btn=>btn.addEventListener("click",()=>chooseDistance(btn.dataset.distance)));document.querySelectorAll(".choice-category").forEach(btn=>btn.addEventListener("click",()=>chooseCategory(btn.dataset.category)));start.addEventListener("click",draw);prize.addEventListener("click",openPrize);again.addEventListener("click",()=>{reset();show(hasMatches()?"draw":"empty");if(hasMatches())setTimeout(draw,250)});reselect.addEventListener("click",()=>{reset();show("distance")});resultHome.addEventListener("click",goHome);emptyReselect.addEventListener("click",()=>{reset();show("distance")});emptyHome.addEventListener("click",goHome);</script></body></html>
