Prize(){if(!canOpen)return;const pool=filteredRestaurants();if(!pool.length){canOpen=false;show("empty");return}canOpen=false;prize.classList.add("open");hint.textContent="打开中...";setTimeout(()=>{currentRestaurant=pool[Math.floor(Math.random()*pool.length)];const r=currentRestaurant;food.src=imageMap[r.icon];food.alt=r.category;nameEl.textContent=r.name;categoryEl.textContent=r.category;locationEl.textContent=r.location;distanceEl.textContent=r.distance;show("result")},540)}go.addEventListener("click",()=>{selectedDistance="all";selectedCategory="all";reset();show("distance")});document.querySelectorAll(".choice-distance").forEach(btn=>btn.addEventListener("click",()=>chooseDistance(btn.dataset.distance)));document.querySelectorAll(".choice-category").forEach(btn=>btn.addEventListener("click",()=>chooseCategory(btn.dataset.category)));start.addEventListener("click",draw);prize.addEventListener("click",openPrize);dropEl.addEventListener("click",openPrize);again.addEventListener("click",()=>{reset();show(hasMatches()?"draw":"empty");if(hasMatches())setTimeout(draw,250)});reselect.addEventListener("click",()=>{reset();show("distance")});resultHome.addEventListener("click",goHome);emptyReselect.addEventListener("click",()=>{reset();show("distance")});emptyHome.addEventListener("click",goHome);

const MAP_LON0=116.3670,MAP_LAT0=39.9590,MAP_SCALE=0.026087,MAP_CX=450,MAP_CY=450;
function latLonToSVG(lat,lon){const x=(lon-MAP_LON0)*111000*Math.cos(39.959*Math.PI/180)*MAP_SCALE+MAP_CX;const y=-(lat-MAP_LAT0)*111000*MAP_SCALE+MAP_CY;return{x:Math.round(x),y:Math.round(y)};}
function showDetail(r){document.getElementById('detail-name').textContent=r.name;if(!r.lat){show('detail');return;}const{x,y}=latLonToSVG(r.lat,r.lon);const w=r.name.length*9+12;const lx=x<450?x-8-w:x+8;const ly=y-8;document.getElementById('detail-marker').innerHTML='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#ff6b8a" stroke="#fff" stroke-width="1.5" filter="url(#dot-shadow)"/><circle cx="'+x+'" cy="'+y+'" r="2" fill="#fff"/><rect x="'+lx+'" y="'+ly+'" width="'+w+'" height="16" rx="4" fill="#fff6c9" stroke="#111" stroke-width="1.2"/><text x="'+(lx+w/2)+'" y="'+(ly+11)+'" font-size="9" font-weight="900" font-family="Microsoft YaHei,sans-serif" fill="#111" text-anchor="middle">'+r.name+'</text>';
  // 以餐厅标记为中心初始化视图
  const wrap=document.getElementById('detail-map-wrap');
  const inner=document.getElementById('detail-map-inner');
  const slider=document.getElementById('map-zoom-slider');
  const pctLbl=document.getElementById('map-zoom-pct');
  let curScale=parseFloat(slider.value)||0.5;

  // 平移状态
  let panX=0, panY=0;

  function applyTransform(){
    inner.style.transform='translate('+panX+'px,'+panY+'px) scale('+curScale+')';
  }

  function centerOn(cx,cy){
    const wx=wrap.clientWidth, wy=wrap.clientHeight;
    panX=wx/2-cx*curScale;
    panY=wy/2-cy*curScale;
    applyTransform();
  }

  function zoomAround(newScale, pivotX, pivotY){
    // pivotX/Y 是相对 wrap 的像素坐标，缩放后保持该点不动
    newScale=Math.min(3,Math.max(0.3,newScale));
    // 当前 pivot 在 inner 坐标系的位置
    const ix=(pivotX-panX)/curScale, iy=(pivotY-panY)/curScale;
    curScale=newScale;
    panX=pivotX-ix*curScale;
    panY=pivotY-iy*curScale;
    slider.value=curScale;
    pctLbl.textContent=Math.round(curScale*100)+'%';
    applyTransform();
  }

  centerOn(x, y);
  curScale=parseFloat(slider.value)||0.5;
  centerOn(x, y);

  // 滑轨：以餐厅点为锚点缩放
  slider.oninput=function(){
    const newScale=parseFloat(this.value);
    const wx=wrap.clientWidth, wy=wrap.clientHeight;
    const pivotX=wx/2, pivotY=wy/2;
    zoomAround(newScale, pivotX, pivotY);
  };

  // 滚轮缩放：以鼠标位置为锚点
  wrap.onwheel=function(e){
    e.preventDefault();
    const rect=wrap.getBoundingClientRect();
    zoomAround(curScale+(e.deltaY<0?0.1:-0.1), e.clientX-rect.left, e.clientY-rect.top);
  };

  // 拖拽平移
  let dragging=false, dragStartX=0, dragStartY=0, panStartX=0, panStartY=0;
  wrap.onmousedown=function(e){
    dragging=true; dragStartX=e.clientX; dragStartY=e.clientY;
    panStartX=panX; panStartY=panY;
    wrap.style.cursor='grabbing';
    e.preventDefault();
  };
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;
    panX=panStartX+(e.clientX-dragStartX);
    panY=panStartY+(e.clientY-dragStartY);
    applyTransform();
  });
  window.addEventListener('mouseup',function(){
    if(dragging){dragging=false;wrap.style.cursor='grab';}
  });

  // 触摸拖拽（移动端）
  let touchStart=null, panStartTouch={x:0,y:0};
  wrap.addEventListener('touchstart',function(e){
    if(e.touches.length===1){
      touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
      panStartTouch={x:panX,y:panY};
    }
  },{passive:true});
  wrap.addEventListener('touchmove',function(e){
    if(e.touches.length===1&&touchStart){
      panX=panStartTouch.x+(e.touches[0].clientX-touchStart.x);
      panY=panStartTouch.y+(e.touches[0].clientY-touchStart.y);
      applyTransform();
      e.preventDefault();
    }
  },{passive:false});
  wrap.addEventListener('touchend',function(){touchStart=null;},{passive:true});

  show('detail');
}
